<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Handless racer</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>

    <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  </head>

  <body style="background-color:white;">
    <script src="sketch.js"></script>
    <script type="module" src="detection.js"></script>
    <div style="display: flex;">
      <div style="flex: 1" id="game"></div>
      <div id="liveView" class="videoView" style="flex: 1;">
        <div style="position: relative;">
          <video id="webcam" style="position: abso; transform: scaleX(-1); -webkit-transform: scaleX(-1);" autoplay playsinline></video>
          <canvas class="output_canvas" id="output_canvas" style="position: absolute; left: 0px; top: 0px; transform: scaleX(-1); -webkit-transform: scaleX(-1);"></canvas>
        </div>
      </div>
    </div>
  </body>
</html>
